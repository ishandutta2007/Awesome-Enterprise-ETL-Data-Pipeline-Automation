<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="pipeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Filters for Glows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #64748b;
    }
    .node-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      fill: #38bdf8;
      font-weight: 600;
    }
    /* Flow Animations */
    @keyframes flowDash {
      to {
        stroke-dashoffset: -120;
      }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.06); }
    }
    @keyframes streamParticle {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .animated-pipe {
      stroke-dasharray: 8 12;
      animation: flowDash 3s linear infinite;
    }
    .animated-pipe-fast {
      stroke-dasharray: 6 10;
      animation: flowDash 1.8s linear infinite;
    }
    .glowing-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Background Orbs (Behind content) -->
  <circle cx="150" cy="100" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#glowFilter)" class="glowing-orb" style="animation-delay: 0s;" />
  <circle cx="1050" cy="300" r="160" fill="#a855f7" fill-opacity="0.14" filter="url(#glowFilter)" class="glowing-orb" style="animation-delay: 3s;" />
  <circle cx="600" cy="380" r="120" fill="#6366f1" fill-opacity="0.1" filter="url(#glowFilter)" class="glowing-orb" style="animation-delay: 1.5s;" />

  <!-- Dynamic Pipeline Streams in the Lower Background (Data flow visualization) -->
  <g opacity="0.85">
    <!-- Stream Line 1 -->
    <path d="M 50 350 C 250 350, 350 310, 550 310 C 750 310, 850 360, 1150 360" fill="none" stroke="url(#pipeGradient)" stroke-width="4" />
    <path d="M 50 350 C 250 350, 350 310, 550 310 C 750 310, 850 360, 1150 360" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-pipe" />

    <!-- Stream Line 2 -->
    <path d="M 50 380 C 200 380, 400 340, 650 340 C 900 340, 1000 390, 1150 390" fill="none" stroke="url(#pipeGradient)" stroke-width="3" />
    <path d="M 50 380 C 200 380, 400 340, 650 340 C 900 340, 1000 390, 1150 390" fill="none" stroke="#c084fc" stroke-width="1.5" class="animated-pipe-fast" />

    <!-- Flow Stage Checkpoints (Subtle background data nodes) -->
    <g transform="translate(180, 340)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <text x="0" y="24" text-anchor="middle" class="node-text">EXTRACT</text>
    </g>
    <g transform="translate(480, 315)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#818cf8" />
      <text x="0" y="24" text-anchor="middle" class="node-text">CDC STREAM</text>
    </g>
    <g transform="translate(780, 325)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#a855f7" />
      <text x="0" y="24" text-anchor="middle" class="node-text">TRANSFORM</text>
    </g>
    <g transform="translate(1020, 370)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#34d399" />
      <text x="0" y="24" text-anchor="middle" class="node-text" fill="#34d399">LOAD &amp; LAKE</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitles, Feature Badges (Always in Front) -->
  <g id="foreground-content">
    <!-- Top Pill / Badge -->
    <g transform="translate(600, 52)">
      <rect x="-170" y="0" width="340" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="-145" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="20" text-anchor="middle" class="badge-pill-text" fill="#38bdf8">ENTERPRISE DATA PLATFORM CURATION</text>
    </g>

    <!-- Main Title with Gradient fill on keywords -->
    <text x="600" y="130" text-anchor="middle" class="title-text">
      Enterprise ETL &amp; Data Pipeline Automation
    </text>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <text x="600" y="172" text-anchor="middle" class="subtitle-text">
      The Definitive Guide to Cloud ELT, Open-Source CDC, and Distributed Ingestion Engines
    </text>

    <!-- Tagline / Metrics Highlight -->
    <text x="600" y="205" text-anchor="middle" class="tagline-text">
      Curated Commercial SaaS Platforms • High-Performance Open Source • Real-Time Streaming &amp; AI Vector Pipelines
    </text>

    <!-- Feature Attribute Cards / Badges (In Foreground) -->
    <g transform="translate(600, 240)">
      <!-- Pill 1 -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="82" y="23" text-anchor="middle" class="badge-pill-text">⚡ Zero-ETL &amp; CDC</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="82" y="23" text-anchor="middle" class="badge-pill-text">🔄 Lakehouse ELT</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="82" y="23" text-anchor="middle" class="badge-pill-text">🛠️ Python &amp; SQL Mesh</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <text x="90" y="23" text-anchor="middle" class="badge-pill-text">🤖 AI &amp; Vector Ingest</text>
      </g>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>