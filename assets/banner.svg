<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="pipeGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="50%" stop-color="#6366f1" stop-opacity=".7"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".3"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity=".2"/></pattern><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.06)}}@keyframes streamParticle{0%{offset-distance:0;opacity:0}10%,90%{opacity:1}}.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif;font-weight:800;font-size:46px;fill:#fff;letter-spacing:-1px}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-pill-text,.subtitle-text,.tagline-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.badge-pill-text{font-weight:600;font-size:13px;fill:#e2e8f0;letter-spacing:.5px}.tagline-text{font-weight:400;font-size:14px;fill:#64748b}.node-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;fill:#38bdf8;font-weight:600}.animated-pipe{stroke-dasharray:8 12;animation:flowDash 3s linear infinite}.animated-pipe-fast{stroke-dasharray:6 10;animation:flowDash 1.8s linear infinite}.glowing-orb{transform-origin:center;animation:pulseGlow 6s ease-in-out infinite}</style><rect width="1200" height="420" fill="url(#bgGradient)"/><rect width="1200" height="420" fill="url(#grid)"/><circle cx="150" cy="100" r="140" fill="#38bdf8" fill-opacity=".12" class="glowing-orb" filter="url(#glowFilter)" style="animation-delay:0s"/><circle cx="1050" cy="300" r="160" fill="#a855f7" fill-opacity=".14" class="glowing-orb" filter="url(#glowFilter)" style="animation-delay:3s"/><circle cx="600" cy="380" r="120" fill="#6366f1" fill-opacity=".1" class="glowing-orb" filter="url(#glowFilter)" style="animation-delay:1.5s"/><g opacity=".85"><path fill="none" stroke="url(#pipeGradient)" stroke-width="4" d="M 50 350 C 250 350, 350 310, 550 310 C 750 310, 850 360, 1150 360"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 350 C 250 350, 350 310, 550 310 C 750 310, 850 360, 1150 360" class="animated-pipe"/><path fill="none" stroke="url(#pipeGradient)" stroke-width="3" d="M 50 380 C 200 380, 400 340, 650 340 C 900 340, 1000 390, 1150 390"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M 50 380 C 200 380, 400 340, 650 340 C 900 340, 1000 390, 1150 390" class="animated-pipe-fast"/><g transform="translate(180, 340)"><circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><circle cx="0" cy="0" r="4" fill="#38bdf8"/><text x="0" y="24" class="node-text" text-anchor="middle">EXTRACT</text></g><g transform="translate(480, 315)"><circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/><circle cx="0" cy="0" r="4" fill="#818cf8"/><text x="0" y="24" class="node-text" text-anchor="middle">CDC STREAM</text></g><g transform="translate(780, 325)"><circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/><circle cx="0" cy="0" r="4" fill="#a855f7"/><text x="0" y="24" class="node-text" text-anchor="middle">TRANSFORM</text></g><g transform="translate(1020, 370)"><circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/><circle cx="0" cy="0" r="4" fill="#34d399"/><text x="0" y="24" fill="#34d399" class="node-text" text-anchor="middle">LOAD &amp; LAKE</text></g></g><g id="foreground-content"><g transform="translate(600, 52)"><rect width="340" height="30" x="-170" y="0" fill="#1e293b" fill-opacity=".85" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="15"/><circle cx="-145" cy="15" r="4" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="0" y="20" fill="#38bdf8" class="badge-pill-text" text-anchor="middle">ENTERPRISE DATA PLATFORM CURATION</text></g><text x="600" y="130" class="title-text" text-anchor="middle">Enterprise ETL &amp; Data Pipeline Automation</text><text x="600" y="172" class="subtitle-text" text-anchor="middle">The Definitive Guide to Cloud ELT, Open-Source CDC, and Distributed Ingestion Engines</text><text x="600" y="205" class="tagline-text" text-anchor="middle">Curated Commercial SaaS Platforms • High-Performance Open Source • Real-Time Streaming &amp; AI Vector Pipelines</text><g><g transform="translate(600, 240) translate(-360, 0)"><rect width="165" height="36" x="0" y="0" fill="#0f172a" fill-opacity=".9" stroke="#334155" stroke-width="1.2" rx="8"/><text x="82" y="23" class="badge-pill-text" text-anchor="middle">⚡ Zero-ETL &amp; CDC</text></g><g transform="translate(600, 240) translate(-1